name: FiyatAvcisiTR Bulut APK Derle

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'cloud_monitor/deals_snapshot.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Debug APK derle
        run: |
          if [ -f "FiyatAvcisiTR_Bulut/settings.gradle.kts" ]; then cd FiyatAvcisiTR_Bulut; fi
          gradle assembleDebug --stacktrace

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: FiyatAvcisiTR-Bulut-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
